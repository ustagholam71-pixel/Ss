<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>طلاجات | خرید و فروش طلا</title>
<meta name="theme-color" content="#15110c">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#15110c;
    --surface:#1f1911;
    --surface2:#271f14;
    --gold:#d7ab5f;
    --gold-deep:#a97b28;
    --up:#4caf7d;
    --down:#e0685f;
    --text:#f4efe4;
    --muted:#a89a80;
    --line:#3a2f1e;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn','Tahoma','Segoe UI','Arial',sans-serif;
    background:#0c0906;
    background-image:radial-gradient(circle at 50% 0%, rgba(215,171,95,.06) 0%, transparent 55%);
    color:var(--text);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:520px;
    margin:14px auto;
    min-height:calc(100vh - 28px);
    background:var(--bg);
    position:relative;
    border:1px solid rgba(215,171,95,.3);
    border-radius:26px;
    box-shadow:0 0 0 1px rgba(215,171,95,.1), 0 0 0 5px rgba(215,171,95,.04), 0 26px 60px -24px rgba(0,0,0,.7);
    display:flex;
    flex-direction:column;
  }
  #view{padding-bottom:14px;flex:1;}

  .topbar{position:sticky;top:0;z-index:20;background:#1a140d;border-bottom:1px solid var(--line);border-radius:26px 26px 0 0;color:var(--text);padding:14px 16px;display:flex;align-items:center;gap:10px;}
  .topbar .back-btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:10px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .topbar h1{font-size:16px;font-weight:700;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brand-mark{font-weight:800;font-size:18.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;color:var(--gold);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brand-mark .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;flex-shrink:0;}
  .mock-pill{font-size:10px;font-weight:700;color:#e8c98a;background:rgba(215,171,95,.12);border:1px solid rgba(215,171,95,.35);border-radius:999px;padding:4px 9px;flex-shrink:0;}
  .switch-btn{background:var(--surface2);border:1px solid var(--line);color:var(--gold);font-size:10.5px;font-weight:700;border-radius:10px;padding:7px 10px;cursor:pointer;flex-shrink:0;font-family:inherit;}

  .stamp{width:40px;height:40px;border-radius:50%;border:2px dashed rgba(215,171,95,.55);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
  .stamp::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(215,171,95,.35);}
  .stamp span{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:-.3px;}

  /* ---------- Role select ---------- */
  .role-wrap{padding:40px 20px;}
  .role-hero{text-align:center;margin-bottom:30px;}
  .role-hero h1{font-size:26px;color:var(--gold);margin:0 0 8px;font-weight:800;}
  .role-hero p{font-size:13px;color:var(--muted);margin:0;line-height:1.9;}
  .role-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;align-items:center;gap:14px;cursor:pointer;margin-bottom:14px;}
  .role-card:active{transform:scale(.98);}
  .role-card .r-ic{font-size:30px;width:56px;height:56px;background:var(--surface2);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .role-card .r-info h3{margin:0 0 4px;font-size:15.5px;}
  .role-card .r-info p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.8;}

  /* ---------- Price hero (buyer home) ---------- */
  .price-hero{margin:16px 16px 0;background:linear-gradient(160deg,var(--surface) 0%,#241c11 100%);border:1px solid var(--line);border-radius:22px;padding:20px 18px;position:relative;overflow:hidden;}
  .price-hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;}
  .price-hero-title{font-size:13px;color:var(--muted);font-weight:600;}
  .price-hero-amount{font-size:30px;font-weight:800;color:var(--text);line-height:1.4;margin:6px 0 2px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .price-hero-amount .u{font-size:12.5px;color:var(--muted);font-weight:600;}
  .change-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;margin-top:8px;}
  .change-chip.up{background:rgba(76,175,125,.14);color:var(--up);}
  .change-chip.down{background:rgba(224,104,95,.14);color:var(--down);}
  .price-hero-meta{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.9;}
  .mock-banner{margin:12px 16px 0;background:rgba(215,171,95,.08);border:1px solid rgba(215,171,95,.25);border-radius:12px;padding:10px 12px;font-size:11px;color:#e8c98a;line-height:1.8;}
  .mini-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 4px;scrollbar-width:none;}
  .mini-strip::-webkit-scrollbar{display:none;}
  .mini-card{flex-shrink:0;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .mini-card .mc-title{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .mini-card .mc-amount{font-size:13.5px;font-weight:800;}
  .mini-card .mc-change{font-size:10px;font-weight:700;margin-top:4px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px;}
  .section-head h3{font-size:15px;font-weight:700;margin:0;}
  .section-head a{font-size:12px;color:var(--gold);text-decoration:none;font-weight:600;cursor:pointer;}

  .search-wrap{padding:12px 16px 4px;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;}
  .search-box input{border:none;outline:none;background:transparent;font-family:inherit;font-size:14.5px;color:var(--text);flex:1;min-width:0;}
  .search-box input::placeholder{color:var(--muted);}

  .prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 16px 8px;}
  .prod-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;}
  .prod-card:active{transform:scale(.98);}
  .prod-thumb{width:100%;aspect-ratio:1/1;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;}
  .prod-thumb img{width:100%;height:100%;object-fit:cover;}
  .prod-body{padding:10px;}
  .prod-body .p-name{font-size:12.5px;font-weight:700;line-height:1.6;margin-bottom:6px;min-height:38px;}
  .prod-body .p-meta{font-size:10.5px;color:var(--muted);margin-bottom:6px;}
  .prod-body .p-price{font-size:13px;font-weight:800;color:var(--gold);}

  .state-msg{margin:30px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:2;padding:30px 16px;background:var(--surface);border-radius:16px;border:1px dashed var(--line);}
  .state-msg .big-ic{font-size:28px;display:block;margin-bottom:8px;}

  .detail-img{width:100%;aspect-ratio:1/1;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:70px;overflow:hidden;}
  .detail-img img{width:100%;height:100%;object-fit:cover;}
  .detail-body{padding:18px 16px 0;}
  .detail-body h2{margin:0 0 8px;font-size:19px;font-weight:800;}
  .detail-price{font-size:22px;font-weight:800;color:var(--gold);margin-bottom:6px;}
  .detail-meta{font-size:12px;color:var(--muted);margin-bottom:14px;}

  .block{margin:14px 16px 0;background:var(--surface);border-radius:16px;padding:16px;border:1px solid var(--line);}
  .block h4{margin:0 0 8px;font-size:13.5px;font-weight:700;color:var(--gold);}
  .block p{margin:0;font-size:12.5px;line-height:1.9;color:var(--muted);}

  .action-row{display:flex;gap:10px;margin:14px 16px 0;}
  .btn{flex:1;text-align:center;padding:13px 10px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;border:none;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;}
  .btn-primary{background:var(--gold);color:#241505;}
  .btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--line);}
  .btn-danger{background:rgba(224,104,95,.15);color:var(--down);border:1.5px solid rgba(224,104,95,.4);}
  .btn-block{width:100%;}

  .contact-row{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);margin-bottom:8px;}
  .contact-row:last-child{margin-bottom:0;}
  .contact-row .ic{font-size:15px;}
  .contact-row small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;}
  .contact-row strong{font-size:12.5px;}

  .comment-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .comment-item:last-child{border-bottom:none;}
  .comment-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .comment-author{font-size:12.5px;font-weight:700;}
  .comment-stars{color:var(--gold);font-size:11px;}
  .comment-date{font-size:10px;color:var(--muted);}
  .comment-text{font-size:12px;color:var(--muted);line-height:1.8;margin:0;}

  .form-card{margin:16px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;}
  .field input[type=text],.field input[type=number],.field input[type=tel],.field select,.field textarea{
    width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:12px;
    padding:12px 14px;font-family:inherit;font-size:14.5px;outline:none;
  }
  .field textarea{min-height:80px;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);}
  .field-error{color:var(--down);font-size:11.5px;margin-top:6px;}
  .field-hint{color:var(--muted);font-size:10.5px;margin-top:6px;line-height:1.7;}
  .calc-result{background:var(--surface2);border:1px dashed rgba(215,171,95,.4);border-radius:14px;padding:16px;text-align:center;}
  .calc-result .cr-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .calc-result .cr-amount{font-size:20px;font-weight:800;color:var(--gold);}
  .calc-result .cr-amount .u{font-size:11.5px;color:var(--muted);font-weight:600;}

  .upload-box{border:1.5px dashed rgba(215,171,95,.4);border-radius:14px;padding:16px;text-align:center;background:var(--surface2);cursor:pointer;position:relative;}
  .upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .upload-preview{width:100%;aspect-ratio:1/1;max-width:160px;margin:0 auto 10px;border-radius:12px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:34px;}
  .upload-preview img{width:100%;height:100%;object-fit:cover;}
  .upload-box .u-label{font-size:12px;color:var(--gold);font-weight:700;}
  .upload-box .u-sub{font-size:10.5px;color:var(--muted);margin-top:4px;}

  .seller-id-card{margin:16px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
  .seller-id-card .s-ic{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--gold);flex-shrink:0;}
  .seller-id-card .s-info{flex:1;min-width:0;}
  .seller-id-card .s-info strong{font-size:13.5px;display:block;}
  .seller-id-card .s-info small{font-size:11px;color:var(--muted);}

  .myprod-row{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 16px 10px;align-items:center;}
  .myprod-row .mp-thumb{width:56px;height:56px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex-shrink:0;}
  .myprod-row .mp-thumb img{width:100%;height:100%;object-fit:cover;}
  .myprod-row .mp-info{flex:1;min-width:0;}
  .myprod-row .mp-name{font-size:12.5px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .myprod-row .mp-price{font-size:11.5px;color:var(--gold);font-weight:700;}
  .myprod-row .mp-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn.danger{color:var(--down);border-color:rgba(224,104,95,.4);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#241505;font-size:12.5px;font-weight:700;padding:10px 18px;border-radius:999px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.4);}

  .skeleton{background:linear-gradient(90deg,#241d13 25%,#2c2317 37%,#241d13 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:12px;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  .bottom-nav{position:sticky;bottom:0;background:#1a140d;border-top:1px solid var(--line);border-radius:0 0 26px 26px;display:flex;z-index:30;padding:6px 2px calc(6px + env(safe-area-inset-bottom));}
  .nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;cursor:pointer;color:var(--muted);font-family:inherit;font-size:9.8px;font-weight:600;border-radius:10px;}
  .nav-btn .nic{font-size:17px;}
  .nav-btn.active{color:var(--gold);background:rgba(215,171,95,.08);}

  a{color:inherit;}
  ::selection{background:var(--gold);color:#241505;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view">
    <noscript>
      <div style="padding:40px 20px;text-align:center;">این صفحه برای نمایش نیاز به اجرای جاوااسکریپت دارد. لطفاً فایل را در یک مرورگر کامل باز کنید.</div>
    </noscript>
  </main>
  <nav class="bottom-nav" id="bottomNav" style="display:none;"></nav>
</div>

  function esc(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // کیبورد فارسی/عربی گوشی‌ها معمولاً حتی در فیلدهای عددی هم ارقام
  // فارسی (۰-۹) یا عربی (٠-٩) وارد می‌کند که parseFloat آن‌ها را
  // نمی‌شناسد. این تابع هر دو نوع را قبل از پردازش به ارقام انگلیسی
  // تبدیل می‌کند تا فرم‌ها همیشه درست کار کنند.
  function toEnglishDigits(str) {
    if (str === null || str === undefined) return "";
    var fa = "۰۱۲۳۴۵۶۷۸۹", ar = "٠١٢٣٤٥٦٧٨٩";
    return String(str).replace(/[۰-۹٠-٩]/g, function (ch) {
      var i = fa.indexOf(ch);
      if (i !== -1) return String(i);
      i = ar.indexOf(ch);
      return i !== -1 ? String(i) : ch;
    });
  }
  function parseNum(val) {
    return parseFloat(toEnglishDigits(val).replace(/[^\d.\-]/g, ""));
  }
  function digitsOnly(val) {
    return toEnglishDigits(val).replace(/\D/g, "");
  }

          کار می‌کند و نیاز به فایل جدا ندارد).
       ۲. اگر مرورگر با همین مانیفست اجازه نصب خودکار بدهد
          (رویداد beforeinstallprompt)، از همان استفاده می‌کند.
       ۳. در غیر این صورت، راهنمای نصب دستی (که در همه مرورگرها
          همیشه کار می‌کند) را نشان می‌دهد.
     برای نصب خودکارِ تضمین‌شده در همه حالت‌ها، باید manifest.json
     و sw.js به‌صورت فایل جداگانه کنار index.html قرار بگیرند.
     ========================================================= */
  var LS_PWA_ASKED = "talajat_pwa_asked_v1";
  var deferredInstallPrompt = null;

  function initPWA() {
    // مانیفست اکنون یک فایل واقعی (manifest.json) است — این خودش
    // در index.html به‌صورت <link rel="manifest"> لینک شده.
    try {
      var appleIcon = document.createElement("link");
      appleIcon.rel = "apple-touch-icon";
      appleIcon.href = PWA_ICON_192;
      document.head.appendChild(appleIcon);
    } catch (e) {}

    // ثبت سرویس‌ورکر واقعی — شرط لازم Chrome برای پیشنهاد خودکار نصب.
    // فقط روی http/https کار می‌کند؛ روی file:// یا مرورگرهای خیلی
    // قدیمی بی‌صدا نادیده گرفته می‌شود، بدون این‌که بقیه برنامه بشکند.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    window.addEventListener("appinstalled", function () {
      safeSetLS(LS_PWA_ASKED, true);
    });

    // اگر قبلاً یک‌بار پرسیده‌ایم یا برنامه از قبل نصب شده، دوباره نمی‌پرسیم
    var alreadyAsked = safeGetLS(LS_PWA_ASKED, false);
    var isStandaloneAlready = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
    if (alreadyAsked || isStandaloneAlready) return;

    setTimeout(function () { showInstallAskModal(); }, 1200);
  }

  function detectPlatform() {
    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /Android/.test(ua);
    return isIOS ? "ios" : (isAndroid ? "android" : "desktop");
  }

  function showInstallAskModal() {
    var overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;";
    var platform = detectPlatform();
    overlay.innerHTML =
      '<div style="width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-top-right-radius:22px;border-top-left-radius:22px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));">' +
        '<div style="text-align:center;font-size:34px;margin-bottom:10px;">📲</div>' +
        '<h3 style="text-align:center;margin:0 0 8px;font-size:16px;color:var(--gold);">نصب ' + esc(SITE_NAME || "طلاجات") + " روی صفحه اصلی" + "</h3>" +
        '<p style="text-align:center;margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.9;">می‌خواهید این برنامه را نصب کنید تا مثل یک اپ واقعی، مستقیم از صفحه اصلی گوشی باز شود؟</p>' +
        '<div style="display:flex;gap:10px;">' +
          '<button class="btn btn-primary" id="pwaYesBtn">بله، نصب کن</button>' +
          '<button class="btn btn-secondary" id="pwaNoBtn">فعلاً نه</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);

    function close() {
      safeSetLS(LS_PWA_ASKED, true);
      overlay.remove();
    }

    document.getElementById("pwaNoBtn").addEventListener("click", close);

    document.getElementById("pwaYesBtn").addEventListener("click", function () {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(function () { deferredInstallPrompt = null; });
        close();
        return;
      }
      // مرورگر اجازه نصب خودکار نداد؛ راهنمای دستی نشان بده (همیشه کار می‌کند)
      showManualInstallGuide(platform, overlay);
    });
  }

  function showManualInstallGuide(platform, overlay) {
    var steps;
    if (platform === "ios") {
      steps = [
        "در پایین صفحه Safari، روی دکمه Share (مربع با فلش رو به بالا) بزنید.",
        "در فهرست باز‌شده، «Add to Home Screen» را پیدا و لمس کنید.",
        "روی «Add» در بالای صفحه بزنید — آیکون برنامه به صفحه اصلی گوشی اضافه می‌شود."
      ];
    } else if (platform === "android") {
      steps = [
        "روی آیکون سه‌نقطه (⋮) بالای Chrome بزنید.",
        "گزینه «Add to Home screen» یا «Install app» را بزنید.",
        "روی «Install» یا «Add» تأیید بزنید."
      ];
    } else {
      steps = [
        "در نوار آدرس مرورگر، دنبال آیکون نصب (یک صفحه با علامت +) بگردید.",
        "روی آن بزنید و «Install» را تأیید کنید."
      ];
    }
    overlay.querySelector("div").innerHTML =
      '<div style="text-align:center;font-size:30px;margin-bottom:10px;">📲</div>' +
      '<h3 style="text-align:center;margin:0 0 14px;font-size:15px;color:var(--gold);">مراحل نصب دستی</h3>' +
      '<ol style="margin:0 0 18px;padding-right:20px;font-size:12.5px;color:var(--muted);line-height:2.1;">' +
        steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") +
      "</ol>" +
      '<button class="btn btn-primary btn-block" id="pwaCloseBtn">متوجه شدم</button>';
    document.getElementById("pwaCloseBtn").addEventListener("click", function () {
      safeSetLS(LS_PWA_ASKED, true);
      overlay.remove();
    });
  }

  function loadAll() {
    viewEl.innerHTML = loadingSkeleton();
    fetchDataFile().catch(function () { return FALLBACK_DATA; }).then(function (seed) {
      if (!seed || !Array.isArray(seed.prices) || !Array.isArray(seed.products)) throw new Error("bad-shape");
      return getGoldPrices().catch(function () {
        // اتصال به API واقعی ممکن نشد (کلید خالی، خطای شبکه، یا CORS)؛
        // به قیمت نمونه برمی‌گردیم تا برنامه از کار نیفتد.
        return { meta: seed.meta, prices: seed.prices };
      }).then(function (priceRes) {
        DATA = { siteName: seed.siteName, meta: priceRes.meta, prices: priceRes.prices };
        var stored = safeGetLS(LS_PRODUCTS, null);
        if (stored && Array.isArray(stored)) {
          PRODUCTS = stored;
        } else {
          PRODUCTS = seed.products.slice();
          saveProducts();
        }
        SITE_NAME = localStorage.getItem(LS_SITE_NAME) || DATA.siteName;
        CURRENT_SELLER = safeGetLS(LS_SELLER, null);
        DATA_ERROR = false;
        LAST_CHECK = new Date();
        LAST_CHECK_FAILED = false;
        render();
      });
    }).catch(function () {
      DATA_ERROR = true;
      render();
    });
  }

  function refreshPrices() {
    if (REFRESHING) return;
    REFRESHING = true;
    getGoldPrices().then(function (res) {
      DATA.meta = res.meta;
      DATA.prices = res.prices;
      LAST_CHECK = new Date();
      LAST_CHECK_FAILED = false;
    }).catch(function () {
      LAST_CHECK = new Date();
      LAST_CHECK_FAILED = true;
    }).then(function () {
      REFRESHING = false;
      render();
    });
  }

  function loadingSkeleton() {
    return '<div style="padding:16px;"><div class="skeleton" style="height:150px;border-radius:22px;margin-bottom:12px;"></div><div class="skeleton" style="height:60px;border-radius:14px;"></div></div>';
  }

  function render() {
    var hash = location.hash || "#/";

    if (DATA_ERROR) {
      renderTopbar("طلاجات", false, null, false);
      bottomNavEl.style.display = "none";
      viewEl.innerHTML = fullErrorState();
      var retryBtn = document.getElementById("retryBtn");
      if (retryBtn) retryBtn.addEventListener("click", loadAll);
      return;
    }
    if (!DATA) return;

    var m;
    if (hash === "#/" || hash === "") {
      setBottomNav(null, hash);
      renderRoleSelect();
    } else if (hash === "#/buyer") {
      setBottomNav("buyer", hash);
      renderBuyerHome();
    } else if (hash.indexOf("#/buyer/products") === 0) {
      setBottomNav("buyer", hash);
      renderBuyerProducts(hash);
    } else if ((m = hash.match(/^#\/buyer\/product\/([^/]+)$/))) {
      setBottomNav("buyer", hash);
      renderProductDetail(decodeURIComponent(m[1]));
    } else if (hash === "#/seller") {
      setBottomNav("seller", hash);
      renderSellerHome();
    } else if (hash === "#/seller/add") {
      setBottomNav("seller", hash);
      renderSellerAdd();
    } else if ((m = hash.match(/^#\/seller\/edit\/([^/]+)$/))) {
      setBottomNav("seller", hash);
      renderSellerEdit(decodeURIComponent(m[1]));
    } else if (hash === "#/seller/settings") {
      setBottomNav("seller", hash);
      renderSellerSettings();
    } else {
      setBottomNav(null, hash);
      renderNotFound();
    }
    window.scrollTo(0, 0);
  }

  function setBottomNav(section, currentHash) {
    if (!section) {
      bottomNavEl.style.display = "none";
      bottomNavEl.innerHTML = "";
      return;
    }
    bottomNavEl.style.display = "flex";
    var items;
    if (section === "buyer") {
      items = [
        { route: "#/buyer", icon: "🏠", label: "خانه" },
        { route: "#/buyer/products", icon: "💍", label: "محصولات" },
        { route: "#/", icon: "🔀", label: "تغییر پنل" }
      ];
    } else {
      items = [
        { route: "#/seller", icon: "📦", label: "محصولات من" },
        { route: "#/seller/add", icon: "➕", label: "افزودن" },
        { route: "#/seller/settings", icon: "⚙️", label: "تنظیمات" },
        { route: "#/", icon: "🔀", label: "تغییر پنل" }
      ];
    }
    var current = currentHash.split("?")[0];
    bottomNavEl.innerHTML = items.map(function (it) {
      var active = it.route === current || (it.route !== "#/" && current.indexOf(it.route) === 0);
      return '<button class="nav-btn' + (active ? " active" : "") + '" data-route="' + it.route + '"><span class="nic">' + it.icon + "</span>" + it.label + "</button>";
    }).join("");
    bottomNavEl.querySelectorAll(".nav-btn").forEach(function (b) {
      b.addEventListener("click", function () { navigate(b.getAttribute("data-route")); });
    });
  }

  /* ---------------- Topbar ---------------- */

  function renderTopbar(title, showBack, backHash, showSwitch) {
    var html = "";
    if (showBack) {
      html += '<button class="back-btn" id="backBtn" aria-label="بازگشت">→</button><h1>' + esc(title) + "</h1>";
    } else {
      html += '<div class="brand-mark"><span class="dot"></span>' + esc(title) + "</div>";
    }
    if (showSwitch) html += '<button class="switch-btn" id="switchBtn">تغییر پنل</button>';
    topbarEl.innerHTML = html;
    if (showBack) {
      document.getElementById("backBtn").addEventListener("click", function () {
        if (backHash) navigate(backHash); else history.back();
      });
    }
    if (showSwitch) document.getElementById("switchBtn").addEventListener("click", function () { navigate("#/"); });
  }

  function fullErrorState() {
    return '<div class="state-msg"><span class="big-ic">⚠️</span>در حال حاضر دریافت اطلاعات امکان‌پذیر نیست. لطفاً دوباره تلاش کنید.<br><button class="btn btn-primary" style="margin-top:14px;display:inline-flex;max-width:170px;" id="retryBtn">تلاش دوباره</button></div>';
  }
  function renderNotFound() {
    renderTopbar("یافت نشد", true, "#/", false);
    viewEl.innerHTML = '<div class="state-msg"><span class="big-ic">🔍</span>صفحه موردنظر پیدا نشد.</div>';
  }

  /* ---------------- Role select ---------------- */

  function renderRoleSelect() {
    renderTopbar(SITE_NAME, false, null, false);
    viewEl.innerHTML =
      '<div class="role-wrap">' +
        '<div class="role-hero"><h1>' + esc(SITE_NAME) + "</h1><p>قیمت روز طلا و محصولات فروشندگان را ببینید، یا اگر فروشنده هستید محصولات خودتان را ثبت کنید.</p></div>" +
        '<div class="role-card" data-route="#/buyer"><div class="r-ic">🛍️</div><div class="r-info"><h3>ورود به‌عنوان خریدار</h3><p>مشاهده قیمت طلا، محصولات و اطلاعات فروشندگان</p></div></div>' +
        '<div class="role-card" data-route="#/seller"><div class="r-ic">🏪</div><div class="r-info"><h3>ورود به‌عنوان فروشنده</h3><p>افزودن، ویرایش و مدیریت محصولات خودتان</p></div></div>' +
      "</div>";
    viewEl.querySelectorAll("[data-route]").forEach(function (el) {
      el.addEventListener("click", function () { navigate(el.getAttribute("data-route")); });
    });
  }

  /* ---------------- Buyer: home ---------------- */

  function productThumbHTML(p, sizeClass) {
    if (p.image) return '<img src="' + p.image + '" alt="' + esc(p.name) + '">';
    return esc(p.icon || "💍");
  }

  function productCardHTML(p) {
    return (
      '<div class="prod-card" data-id="' + esc(p.id) + '">' +
        '<div class="prod-thumb">' + productThumbHTML(p) + "</div>" +
        '<div class="prod-body">' +
          '<div class="p-name">' + esc(p.name) + "</div>" +
          '<div class="p-meta">' + esc(p.weight) + " گرم · عیار " + esc(p.karat) + "</div>" +
          '<div class="p-price">' + esc(formatToman(p.price)) + " تومان</div>" +
        "</div>" +
      "</div>"
    );
  }

  function attachProductCardHandlers(container) {
    container.querySelectorAll(".prod-card[data-id]").forEach(function (card) {
      card.addEventListener("click", function () {
        navigate("#/buyer/product/" + encodeURIComponent(card.getAttribute("data-id")));
      });
    });
  }

  function renderBuyerHome() {
    renderTopbar(SITE_NAME, false, null, true);
    var g18 = findPrice("gold18");
    var others = DATA.prices.filter(function (p) { return p.id !== "gold18"; });
    var latest = PRODUCTS.slice(0, 4);

    var html = "";
    if (g18) {
      html +=
        '<div class="price-hero"><div class="price-hero-top">' +
          '<div><div class="price-hero-title">' + esc(g18.title) + " (هر " + esc(g18.unit) + ")</div>" +
          '<div class="price-hero-amount">' + esc(formatToman(g18.price)) + ' <span class="u">تومان</span></div>' +
          changeChipHTML(g18) + "</div>" +
          '<div class="stamp" style="width:52px;height:52px;"><span style="font-size:12px;">' + esc(g18.stamp) + "</span></div>" +
        "</div>" +
        '<div class="price-hero-meta">آخرین به‌روزرسانی قیمت: ' + esc(DATA.meta.lastUpdated) + "</div></div>";
    }
    html += '<div class="mock-banner">⚠️ ' + esc(DATA.meta.sourceLabel) + "</div>";
    html += '<div class="mini-strip">' + others.map(function (p) {
      var isUp = p.change >= 0;
      var cur = p.unitCurrency || "تومان";
      return '<div class="mini-card"><div class="mc-title">' + esc(p.title) + '</div><div class="mc-amount">' + esc(formatToman(p.price)) + ' <span style="font-size:10px;color:var(--muted);">' + esc(cur) + '</span></div><div class="mc-change" style="color:' + (isUp ? "var(--up)" : "var(--down)") + '">' + (isUp ? "▲" : "▼") + " " + esc(Math.abs(p.changePercent).toFixed(2)) + "٪</div></div>";
    }).join("") + "</div>";

    html += '<div class="search-wrap"><div class="search-box" id="homeSearchBox"><span>🔎</span><input type="text" id="homeSearchInput" placeholder="جست‌وجوی محصول طلا..."></div></div>';

    html += '<div class="section-head"><h3>جدیدترین محصولات طلا</h3><a id="seeAllLink">مشاهده همه ←</a></div>';
    if (!latest.length) {
      html += '<div class="state-msg"><span class="big-ic">💍</span>هنوز محصولی ثبت نشده است.</div>';
    } else {
      html += '<div class="prod-grid">' + latest.map(productCardHTML).join("") + "</div>";
    }

    viewEl.innerHTML = html;
    attachProductCardHandlers(viewEl);
    document.getElementById("seeAllLink").addEventListener("click", function () { navigate("#/buyer/products"); });
    var input = document.getElementById("homeSearchInput");
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && input.value.trim()) navigate("#/buyer/products?q=" + encodeURIComponent(input.value.trim()));
    });
  }

  /* ---------------- Buyer: products list ---------------- */

  function parseQuery(hash) {
    var qi = hash.indexOf("?"), params = {};
    if (qi === -1) return params;
    hash.substring(qi + 1).split("&").forEach(function (pair) {
      if (!pair) return;
      var parts = pair.split("=");
      params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || "");
    });
    return params;
  }

  function renderBuyerProducts(hash) {
    renderTopbar("محصولات طلا", true, "#/buyer", true);
    var params = parseQuery(hash);
    var html =
      '<div class="search-wrap"><div class="search-box"><span>🔎</span><input type="text" id="listSearchInput" value="' + esc(params.q || "") + '" placeholder="جست‌وجوی محصول..."></div></div>' +
      '<div id="listResults"></div>';
    viewEl.innerHTML = html;

    function apply() {
      var q = document.getElementById("listSearchInput").value.trim().toLowerCase();
      var results = PRODUCTS.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; });
      var el = document.getElementById("listResults");
      if (!results.length) {
        el.innerHTML = '<div class="state-msg"><span class="big-ic">🙁</span>محصولی با این مشخصات پیدا نشد.</div>';
      } else {
        el.innerHTML = '<div class="prod-grid">' + results.map(productCardHTML).join("") + "</div>";
        attachProductCardHandlers(el);
      }
    }
    var t;
    document.getElementById("listSearchInput").addEventListener("input", function () {
      clearTimeout(t); t = setTimeout(apply, 150);
    });
    apply();
  }

  /* ---------------- Buyer: product detail ---------------- */

  function renderProductDetail(id) {
    var p = findProduct(id);
    if (!p) {
      renderTopbar("یافت نشد", true, "#/buyer/products", true);
      viewEl.innerHTML = '<div class="state-msg"><span class="big-ic">🔍</span>این محصول پیدا نشد. ممکن است حذف شده باشد.</div>';

    var phoneDigits = digitsOnly(p.sellerPhone || "");

          return '<div class="comment-item"><div class="comment-head"><span class="comment-author">' + esc(c.author) + '</span><span class="comment-date">' + esc(c.date) + '</span></div><div class="comment-stars">' + stars + '</div><p class="comment-text">' + esc(c.text) + "</p></div>";
        }).join("")
      : '<p style="font-size:12px;color:var(--muted);">هنوز نظری ثبت نشده است.</p>';

      '<div class="detail-img">' + productThumbHTML(p) + "</div>" +

      '<div class="block"><h4>فروشنده و ارتباط</h4>' +

  /* ---------------- Seller: identify / dashboard ---------------- */

  function renderSellerHome() {
    if (!CURRENT_SELLER) {
      renderTopbar("ورود فروشنده", false, null, true);
      viewEl.innerHTML =
        '<div class="form-card">' +

          '<div class="field"><label for="sName">نام فروشگاه / فروشنده</label><input type="text" id="sName" placeholder="مثلاً طلافروشی درخشان"><div class="field-error" id="sNameErr" style="display:none;"></div></div>' +
          '<div class="field"><label for="sPhone">شماره تماس</label><input type="tel" id="sPhone" placeholder="09xxxxxxxxx" inputmode="tel"><div class="field-error" id="sPhoneErr" style="display:none;"></div></div>' +
          '<div class="field"><label for="sAddr">آدرس (اختیاری)</label><input type="text" id="sAddr" placeholder="آدرس فروشگاه"></div>' +
          '<button class="btn btn-primary btn-block" id="sellerStartBtn">ورود / شروع</button>' +
        "</div>";
      document.getElementById("sellerStartBtn").addEventListener("click", function () {
        var name = document.getElementById("sName").value.trim();
        var phone = document.getElementById("sPhone").value.trim();
        var addr = document.getElementById("sAddr").value.trim();
        var ok = true;
        document.getElementById("sNameErr").style.display = "none";
        document.getElementById("sPhoneErr").style.display = "none";
        if (!name) { document.getElementById("sNameErr").textContent = "وارد کردن نام الزامی است."; document.getElementById("sNameErr").style.display = "block"; ok = false; }
        var phoneDigits = digitsOnly(phone);
        if (phoneDigits.length < 8) { document.getElementById("sPhoneErr").textContent = "شماره تماس معتبر وارد کنید."; document.getElementById("sPhoneErr").style.display = "block"; ok = false; }
        if (!ok) return;
        saveSeller({ id: "seller-" + phoneDigits, name: name, phone: phone, address: addr });
        render();
      });
      return;
    }

    renderTopbar("محصولات من", false, null, true);
    var mine = PRODUCTS.filter(function (p) { return p.sellerId === CURRENT_SELLER.id; });

    var html =
      '<div class="seller-id-card"><div class="s-ic">🏪</div><div class="s-info"><strong>' + esc(CURRENT_SELLER.name) + "</strong><small>" + esc(CURRENT_SELLER.phone) + '</small></div><button class="switch-btn" id="logoutBtn">خروج</button></div>' +
      '<div class="action-row" style="margin-top:14px;"><button class="btn btn-primary" id="addProdBtn">➕ افزودن محصول جدید</button></div>' +
      '<div class="section-head"><h3>محصولات من (' + mine.length + ')</h3></div>';

    if (!mine.length) {
      html += '<div class="state-msg"><span class="big-ic">📦</span>هنوز محصولی ثبت نکرده‌اید.</div>';
    } else {
      html += mine.map(function (p) {
        return (
          '<div class="myprod-row">' +
            '<div class="mp-thumb">' + productThumbHTML(p) + "</div>" +
            '<div class="mp-info"><div class="mp-name">' + esc(p.name) + '</div><div class="mp-price">' + esc(formatToman(p.price)) + " تومان</div></div>" +
            '<div class="mp-actions">' +
              '<button class="icon-btn" data-edit="' + esc(p.id) + '" aria-label="ویرایش">✏️</button>' +
              '<button class="icon-btn danger" data-del="' + esc(p.id) + '" aria-label="حذف">🗑️</button>' +
            "</div>" +
          "</div>"
        );
      }).join("");
    }

    viewEl.innerHTML = html;
    document.getElementById("logoutBtn").addEventListener("click", function () { logoutSeller(); render(); });
    document.getElementById("addProdBtn").addEventListener("click", function () { navigate("#/seller/add"); });
    viewEl.querySelectorAll("[data-edit]").forEach(function (b) {
      b.addEventListener("click", function () { navigate("#/seller/edit/" + encodeURIComponent(b.getAttribute("data-edit"))); });
    });
    viewEl.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-del");
        var p = findProduct(id);
        if (p && confirm('محصول «' + p.name + '» حذف شود؟ این کار قابل بازگشت نیست.')) {
          deleteProduct(id);
          toast("محصول حذف شد.");
          render();
        }
      });
    });
  }

  /* ---------------- Seller: add / edit product form ---------------- */

  // عکس‌های واقعی موبایل معمولاً چند مگابایت هستند و مستقیم در
  // localStorage جا نمی‌شوند؛ پیش از ذخیره، سمت مرورگر (با canvas)
  // کوچک و فشرده می‌شوند تا مطمئن شویم واقعاً ذخیره می‌شوند.
  function compressImageFile(file, maxDim, quality, onDone, onError) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try {
          onDone(canvas.toDataURL("image/jpeg", quality));
        } catch (e) { onError(); }
      };
      img.onerror = onError;
      img.src = reader.result;
    };
    reader.onerror = onError;
    reader.readAsDataURL(file);
  }

  function wireUploadBox(existingImage) {
    PENDING_IMAGE = existingImage || null;
    var input = document.getElementById("imgInput");
    var preview = document.getElementById("imgPreview");
    var err = document.getElementById("imgErr");
    input.addEventListener("change", function () {
      err.style.display = "none";
      var file = input.files && input.files[0];
      if (!file) return;
      if (file.type.indexOf("image/") !== 0) {
        err.textContent = "لطفاً یک فایل تصویری انتخاب کنید.";
        err.style.display = "block";
        return;
      }
      if (file.size > 12 * 1024 * 1024) {
        err.textContent = "حجم فایل خیلی زیاد است؛ لطفاً عکسی کمتر از ۱۲ مگابایت انتخاب کنید.";
        err.style.display = "block";
        return;
      }
      preview.innerHTML = '<div style="font-size:11px;color:var(--muted);">در حال آماده‌سازی عکس...</div>';
      compressImageFile(file, 900, 0.72, function (dataUrl) {
        PENDING_IMAGE = dataUrl;
        preview.innerHTML = '<img src="' + PENDING_IMAGE + '" alt="پیش‌نمایش">';
      }, function () {
        err.textContent = "پردازش عکس با خطا مواجه شد. لطفاً عکس دیگری امتحان کنید.";
        err.style.display = "block";
        preview.innerHTML = "🖼️";
      });
    });
  }

  function pricePerGramForKarat(karat) {
    var g24 = findPrice("gold24");
    if (!g24 || !karat) return 0;
    return (g24.price / 24) * karat; // نرخ متناسب با خلوص، بر پایه قیمت طلای ۲۴ عیار
  }

  function computeProductPrice(weight, karat, ojrat) {
    var perGram = pricePerGramForKarat(karat);
    var basePrice = weight * perGram;
    var ojratTotal = weight * ojrat;
    return { perGram: perGram, basePrice: basePrice, ojratTotal: ojratTotal, total: basePrice + ojratTotal };
  }

  function updatePriceCalcBox() {
    var box = document.getElementById("priceCalcBox");
    if (!box) return;
    var weight = parseNum(document.getElementById("pWeight").value);
    var karat = parseNum(document.getElementById("pKarat").value);
    var ojrat = parseNum(document.getElementById("pOjrat").value);
    if (isNaN(ojrat)) ojrat = 0;
    if (isNaN(weight) || weight <= 0 || isNaN(karat) || karat <= 0) {
      box.innerHTML = '<div class="cr-label">وزن و عیار را وارد کنید تا قیمت محاسبه شود</div><div class="cr-amount">۰ <span class="u">تومان</span></div>';
      return;
    }
    var r = computeProductPrice(weight, karat, ojrat);
    box.innerHTML =
      '<div class="cr-label">قیمت پایه طلا (' + esc(weight) + ' گرم × نرخ عیار ' + esc(karat) + ')</div>' +
      '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px;">' + esc(formatToman(r.basePrice)) + ' تومان</div>' +
      '<div class="cr-label">اجرت ساخت (' + esc(weight) + ' گرم × ' + esc(formatToman(ojrat)) + ' تومان)</div>' +
      '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;">' + esc(formatToman(r.ojratTotal)) + ' تومان</div>' +
      '<div class="cr-label">قیمت نهایی محصول</div>' +
      '<div class="cr-amount">' + esc(formatToman(r.total)) + ' <span class="u">تومان</span></div>';
  }

  function wireCalcLive() {
    ["pWeight", "pKarat", "pOjrat"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", updatePriceCalcBox);
    });
    updatePriceCalcBox();
  }

  function productFormHTML(p) {
    var name = p ? p.name : "";
    var weight = p ? p.weight : "";
    var karat = p ? p.karat : "";
    var ojrat = p ? (p.ojrat || 0) : 0;
    var desc = p ? p.description : "";
    var contact = p ? p.sellerPhone : (CURRENT_SELLER ? CURRENT_SELLER.phone : "");
    var previewInner = p && p.image ? '<img src="' + p.image + '" alt="پیش‌نمایش">' : (p ? esc(p.icon || "💍") : "🖼️");
    var g24 = findPrice("gold24");

    return (
      '<div class="form-card">' +
        '<div class="field"><label>عکس محصول</label>' +
          '<div class="upload-box">' +
            '<div class="upload-preview" id="imgPreview">' + previewInner + "</div>" +
            '<div class="u-label">انتخاب عکس از دستگاه</div><div class="u-sub">حداکثر ۳ مگابایت</div>' +
            '<input type="file" id="imgInput" accept="image/*">' +
          "</div>" +
          '<div class="field-error" id="imgErr" style="display:none;"></div>' +
        "</div>" +
        '<div class="field"><label for="pName">نام محصول</label><input type="text" id="pName" value="' + esc(name) + '" placeholder="مثلاً گردنبند طلا طرح برگ"><div class="field-error" id="pNameErr" style="display:none;"></div></div>' +
        '<div class="field"><label for="pWeight">وزن (گرم)</label><input type="text" inputmode="decimal" id="pWeight" value="' + esc(weight) + '" placeholder="مثلاً 6.2"><div class="field-error" id="pWeightErr" style="display:none;"></div></div>' +
        '<div class="field"><label for="pKarat">عیار</label><input type="text" inputmode="decimal" id="pKarat" value="' + esc(karat) + '" placeholder="مثلاً 18">' +
          '<div class="field-hint">' + (g24 ? "نرخ لحظه‌ای طلای ۲۴ عیار: " + esc(formatToman(g24.price)) + " تومان — قیمت هر عیار متناسب با این نرخ محاسبه می‌شود." : "") + "</div>" +
          '<div class="field-error" id="pKaratErr" style="display:none;"></div></div>' +
        '<div class="field"><label for="pOjrat">اجرت ساخت (تومان به ازای هر گرم)</label><input type="text" inputmode="decimal" id="pOjrat" value="' + esc(ojrat) + '" placeholder="مثلاً 800000">' +
          '<div class="field-hint">اگر اجرت ندارد، عدد صفر را وارد کنید.</div>' +
          '<div class="field-error" id="pOjratErr" style="display:none;"></div></div>' +
        '<div class="calc-result" id="priceCalcBox" style="margin-bottom:14px;"></div>' +
        '<div class="field"><label for="pDesc">توضیحات</label><textarea id="pDesc" placeholder="توضیح کوتاهی درباره محصول...">' + esc(desc) + "</textarea></div>" +
        '<div class="field"><label for="pContact">شماره تماس فروشنده</label><input type="tel" id="pContact" value="' + esc(contact) + '" placeholder="09xxxxxxxxx"><div class="field-error" id="pContactErr" style="display:none;"></div></div>' +
      "</div>"
    );
  }

  function readProductForm() {
    var errs = {};
    var name = document.getElementById("pName").value.trim();
    var weight = parseNum(document.getElementById("pWeight").value);
    var karat = parseNum(document.getElementById("pKarat").value);
    var ojrat = parseNum(document.getElementById("pOjrat").value);
    var contact = document.getElementById("pContact").value.trim();
    var desc = document.getElementById("pDesc").value.trim();

    ["pNameErr", "pWeightErr", "pKaratErr", "pOjratErr", "pContactErr"].forEach(function (id) {
      var el = document.getElementById(id); el.style.display = "none";
    });

    if (!name) { errs.name = "وارد کردن نام محصول الزامی است."; }
    if (isNaN(weight) || weight <= 0) { errs.weight = "وزن باید عددی بزرگ‌تر از صفر باشد."; }
    if (isNaN(karat) || karat <= 0 || karat > 24) { errs.karat = "عیار باید عددی بین ۱ تا ۲۴ باشد."; }
    if (isNaN(ojrat) || ojrat < 0) { errs.ojrat = "اجرت نمی‌تواند منفی باشد؛ در صورت نبود اجرت، صفر بگذارید."; }
    var contactDigits = digitsOnly(contact);
    if (contactDigits.length < 8) { errs.contact = "شماره تماس معتبر وارد کنید."; }

    if (errs.name) { document.getElementById("pNameErr").textContent = errs.name; document.getElementById("pNameErr").style.display = "block"; }
    if (errs.weight) { document.getElementById("pWeightErr").textContent = errs.weight; document.getElementById("pWeightErr").style.display = "block"; }
    if (errs.karat) { document.getElementById("pKaratErr").textContent = errs.karat; document.getElementById("pKaratErr").style.display = "block"; }
    if (errs.ojrat) { document.getElementById("pOjratErr").textContent = errs.ojrat; document.getElementById("pOjratErr").style.display = "block"; }
    if (errs.contact) { document.getElementById("pContactErr").textContent = errs.contact; document.getElementById("pContactErr").style.display = "block"; }

    if (Object.keys(errs).length) return null;
    var calc = computeProductPrice(weight, karat, ojrat);
    return { name: name, price: calc.total, weight: weight, karat: karat, ojrat: ojrat, description: desc, sellerPhone: contact };
  }

  function renderSellerAdd() {
    if (!CURRENT_SELLER) { navigate("#/seller"); return; }
    renderTopbar("افزودن محصول", true, "#/seller", false);
    viewEl.innerHTML = productFormHTML(null) + '<div class="action-row"><button class="btn btn-primary btn-block" id="saveBtn">ثبت محصول</button></div>';
    wireUploadBox(null);
    wireCalcLive();
    document.getElementById("saveBtn").addEventListener("click", function () {
      var data = readProductForm();
      if (!data) return;
      var ok = addProduct({
        name: data.name, price: data.price, weight: data.weight, karat: data.karat, ojrat: data.ojrat,
        description: data.description, image: PENDING_IMAGE, icon: "💍",
        sellerId: CURRENT_SELLER.id, sellerName: CURRENT_SELLER.name,
        sellerPhone: data.sellerPhone, sellerAddress: CURRENT_SELLER.address || ""
      });
      if (!ok) {
        toast("فضای ذخیره‌سازی دستگاه پر است — عکس را با حجم کمتری امتحان کنید یا یک محصول قدیمی را حذف کنید.");
        return;
      }
      toast("محصول با موفقیت ثبت شد.");
      navigate("#/seller");
    });
  }

  function renderSellerEdit(id) {
    if (!CURRENT_SELLER) { navigate("#/seller"); return; }
    var p = findProduct(id);
    if (!p || p.sellerId !== CURRENT_SELLER.id) {
      renderTopbar("دسترسی مجاز نیست", true, "#/seller", false);
      viewEl.innerHTML = '<div class="state-msg"><span class="big-ic">🚫</span>این محصول متعلق به شما نیست یا پیدا نشد.</div>';
      return;
    }
    renderTopbar("ویرایش محصول", true, "#/seller", false);
    viewEl.innerHTML =
      productFormHTML(p) +
      '<div class="action-row"><button class="btn btn-primary" id="saveBtn">ذخیره تغییرات</button><button class="btn btn-danger" id="delBtn">حذف محصول</button></div>';
    wireUploadBox(p.image);
    wireCalcLive();
    document.getElementById("saveBtn").addEventListener("click", function () {
      var data = readProductForm();
      if (!data) return;
      var ok = updateProduct(id, {
        name: data.name, price: data.price, weight: data.weight, karat: data.karat, ojrat: data.ojrat,
        description: data.description, image: PENDING_IMAGE, sellerPhone: data.sellerPhone
      });
      if (!ok) {
        toast("فضای ذخیره‌سازی دستگاه پر است — عکس را با حجم کمتری امتحان کنید یا یک محصول قدیمی را حذف کنید.");
        return;
      }
      toast("تغییرات ذخیره شد.");
      navigate("#/seller");
    });
    document.getElementById("delBtn").addEventListener("click", function () {
      if (confirm('محصول «' + p.name + '» حذف شود؟ این کار قابل بازگشت نیست.')) {
        deleteProduct(id);
        toast("محصول حذف شد.");
        navigate("#/seller");
      }

    });
  }

  /* ---------------- Seller: settings ---------------- */

  function renderSellerSettings() {
    if (!CURRENT_SELLER) { navigate("#/seller"); return; }
    renderTopbar("تنظیمات", true, "#/seller", false);
    viewEl.innerHTML =
      '<div class="form-card">' +
        '<div class="field"><label for="siteNameInput">نام سایت</label><input type="text" id="siteNameInput" value="' + esc(SITE_NAME) + '" placeholder="مثلاً طلاجات"><div class="field-hint">این نام در بالای صفحه برای همه خریداران نمایش داده می‌شود.</div></div>' +
        '<button class="btn btn-primary btn-block" id="saveSiteNameBtn">ذخیره</button>' +
      "</div>";
    document.getElementById("saveSiteNameBtn").addEventListener("click", function () {
      var v = document.getElementById("siteNameInput").value.trim();
      if (!v) { toast("نام سایت نمی‌تواند خالی باشد."); return; }
      saveSiteName(v);
      toast("نام سایت ذخیره شد.");
      render();
    });
  }
})();
