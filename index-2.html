<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>نرخ طلا | قیمت لحظه‌ای طلا و محاسبه‌گر</title>
<style>
  :root{
    --bg:#15110c;
    --surface:#1f1911;
    --surface2:#271f14;
    --gold:#d7ab5f;
    --gold-deep:#a97b28;
    --up:#4caf7d;
    --down:#e0685f;
    --text:#f4efe4;
    --muted:#a89a80;
    --line:#3a2f1e;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', 'Tahoma', 'Segoe UI', 'Iranian Sans', 'Arial', sans-serif;
    background:#0c0906;
    background-image:radial-gradient(circle at 50% 0%, rgba(215,171,95,.06) 0%, transparent 55%);
    color:var(--text);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:520px;
    margin:14px auto;
    min-height:calc(100vh - 28px);
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    border:1px solid rgba(215,171,95,.3);
    border-radius:26px;
    box-shadow:
      0 0 0 1px rgba(215,171,95,.1),
      0 0 0 5px rgba(215,171,95,.04),
      0 26px 60px -24px rgba(0,0,0,.7);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:#1a140d;
    border-bottom:1px solid var(--line);
    border-radius:26px 26px 0 0;
    color:var(--text);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .topbar .back-btn{
    background:var(--surface2);
    border:1px solid var(--line);
    color:var(--text);
    width:36px;height:36px;
    border-radius:10px;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .topbar h1{
    font-size:16.5px;
    font-weight:700;
    margin:0;
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .brand-mark{
    font-weight:800;
    font-size:18.5px;
    letter-spacing:-.2px;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--gold);
  }
  .brand-mark .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }
  .mock-pill{
    margin-right:auto;
    font-size:10px;
    font-weight:700;
    color:#e8c98a;
    background:rgba(215,171,95,.12);
    border:1px solid rgba(215,171,95,.35);
    border-radius:999px;
    padding:4px 9px;
  }

  /* ---------- Hallmark stamp (signature element) ---------- */
  .stamp{
    width:40px;height:40px;
    border-radius:50%;
    border:2px dashed rgba(215,171,95,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    position:relative;
  }
  .stamp::before{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    border:1px solid rgba(215,171,95,.35);
  }
  .stamp span{
    font-size:10px;
    font-weight:800;
    color:var(--gold);
    letter-spacing:-.3px;
  }
  .stamp.lg{width:56px;height:56px;}
  .stamp.lg span{font-size:13px;}

  /* ---------- Main price hero ---------- */
  .price-hero{
    margin:16px 16px 0;
    background:linear-gradient(160deg, var(--surface) 0%, #241c11 100%);
    border:1px solid var(--line);
    border-radius:22px;
    padding:20px 18px;
    position:relative;
    overflow:hidden;
  }
  .price-hero::after{
    content:"";
    position:absolute;
    left:-40px;top:-40px;
    width:150px;height:150px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(215,171,95,.10) 0%, transparent 70%);
  }
  .price-hero-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .price-hero-title{
    font-size:13px;
    color:var(--muted);
    font-weight:600;
  }
  .price-hero-amount{
    font-size:32px;
    font-weight:800;
    color:var(--text);
    line-height:1.4;
    margin:6px 0 2px;
    display:flex;
    align-items:baseline;
    gap:6px;
    flex-wrap:wrap;
  }
  .price-hero-amount .u{font-size:13px;color:var(--muted);font-weight:600;}
  .change-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    font-weight:700;
    padding:5px 10px;
    border-radius:999px;
    margin-top:8px;
  }
  .change-chip.up{background:rgba(76,175,125,.14);color:var(--up);}
  .change-chip.down{background:rgba(224,104,95,.14);color:var(--down);}

  .price-hero-meta{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .price-hero-meta .times{font-size:10.5px;color:var(--muted);line-height:1.9;}
  .refresh-btn{
    background:var(--gold);
    color:#241505;
    border:none;
    border-radius:12px;
    padding:9px 14px;
    font-size:12.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    flex-shrink:0;
  }
  .refresh-btn:disabled{opacity:.6;}
  .refresh-btn .spin{display:inline-block;animation:none;}
  .refresh-btn.loading .spin{animation:spin .8s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .mock-banner{
    margin:12px 16px 0;
    background:rgba(215,171,95,.08);
    border:1px solid rgba(215,171,95,.25);
    border-radius:12px;
    padding:10px 12px;
    font-size:11.5px;
    color:#e8c98a;
    line-height:1.8;
  }

  .error-banner{
    margin:12px 16px 0;
    background:rgba(224,104,95,.1);
    border:1px solid rgba(224,104,95,.3);
    border-radius:12px;
    padding:10px 12px;
    font-size:11.5px;
    color:var(--down);
    line-height:1.8;
  }

  /* ---------- Quick actions ---------- */
  .quick-actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:16px 16px 4px;
  }
  .qa-btn{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    color:var(--text);
    font-size:11px;
    font-weight:600;
  }
  .qa-btn .ic{font-size:19px;}
  .qa-btn:active{transform:scale(.96);}

  /* ---------- Section headers ---------- */
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px 8px;
  }
  .section-head h3{
    font-size:15px;
    font-weight:700;
    margin:0;
  }
  .section-head a{
    font-size:12px;
    color:var(--gold);
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
  }

  /* ---------- Price cards (list) ---------- */
  .price-list{padding:6px 16px 8px;display:flex;flex-direction:column;gap:10px;}
  .price-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:default;
  }
  .price-card .pc-info{flex:1;min-width:0;}
  .price-card .pc-title{font-size:14px;font-weight:700;margin-bottom:2px;}
  .price-card .pc-unit{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .price-card .pc-amount{font-size:17px;font-weight:800;color:var(--text);}
  .price-card .pc-amount .u{font-size:11px;color:var(--muted);font-weight:600;}

  /* mini strip on home */
  .mini-strip{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:4px 16px 4px;
    scrollbar-width:none;
  }
  .mini-strip::-webkit-scrollbar{display:none;}
  .mini-card{
    flex-shrink:0;
    min-width:140px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    cursor:pointer;
  }
  .mini-card .mc-title{font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .mini-card .mc-amount{font-size:14.5px;font-weight:800;}
  .mini-card .mc-change{font-size:10.5px;font-weight:700;margin-top:4px;}

  /* ---------- Calculator ---------- */
  .calc-card{
    margin:16px 16px 0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:7px;
  }
  .field input[type=number], .field select{
    width:100%;
    background:var(--surface2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:12px;
    padding:12px 14px;
    font-family:inherit;
    font-size:15px;
    outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--gold);}
  .field-error{color:var(--down);font-size:11.5px;margin-top:6px;}
  .calc-result{
    margin-top:6px;
    background:var(--surface2);
    border:1px dashed rgba(215,171,95,.4);
    border-radius:14px;
    padding:16px;
    text-align:center;
  }
  .calc-result .cr-label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .calc-result .cr-amount{font-size:24px;font-weight:800;color:var(--gold);}
  .calc-result .cr-amount .u{font-size:12px;color:var(--muted);font-weight:600;}
  .calc-result .cr-sub{font-size:10.5px;color:var(--muted);margin-top:6px;}

  /* ---------- Products ---------- */
  .prod-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:6px 16px 8px;
  }
  .prod-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    cursor:pointer;
  }
  .prod-card .p-ic{font-size:26px;margin-bottom:8px;}
  .prod-card .p-name{font-size:12.5px;font-weight:700;line-height:1.6;margin-bottom:6px;min-height:38px;}
  .prod-card .p-meta{font-size:10.5px;color:var(--muted);margin-bottom:6px;}
  .prod-card .p-price{font-size:13px;font-weight:800;color:var(--gold);}

  /* ---------- Product detail ---------- */
  .detail-hero2{
    text-align:center;
    padding:26px 16px 10px;
  }
  .detail-hero2 .d-ic{font-size:44px;margin-bottom:10px;}
  .detail-hero2 h2{font-size:18px;margin:0 0 6px;font-weight:800;}
  .detail-hero2 .d-meta{font-size:11.5px;color:var(--muted);}

  .block{
    margin:14px 16px 0;
    background:var(--surface);
    border-radius:16px;
    padding:16px;
    border:1px solid var(--line);
  }
  .block h4{
    margin:0 0 8px;
    font-size:13.5px;
    font-weight:700;
    color:var(--gold);
  }
  .block p{
    margin:0;
    font-size:12.5px;
    line-height:1.9;
    color:var(--muted);
  }

  .action-row{
    display:flex;
    gap:10px;
    margin:14px 16px 0;
  }
  .btn{
    flex:1;
    text-align:center;
    padding:13px 10px;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    border:none;
    text-decoration:none;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;
  }
  .btn-primary{background:var(--gold);color:#241505;}
  .btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--line);}

  .contact-row{
    background:var(--surface2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 13px;
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--text);
    margin-bottom:8px;
  }
  .contact-row:last-child{margin-bottom:0;}
  .contact-row .ic{font-size:15px;}
  .contact-row small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;}
  .contact-row strong{font-size:12.5px;}

  .comment-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .comment-item:last-child{border-bottom:none;}
  .comment-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .comment-author{font-size:12.5px;font-weight:700;}
  .comment-stars{color:var(--gold);font-size:11px;}
  .comment-date{font-size:10px;color:var(--muted);}
  .comment-text{font-size:12px;color:var(--muted);line-height:1.8;margin:0;}

  /* ---------- Consultation accordion ---------- */
  .accordion{
    margin:14px 16px 0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .accordion + .accordion{margin-top:10px;}
  .acc-head{
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
  }
  .acc-head .chev{color:var(--gold);transition:transform .2s ease;font-size:13px;}
  .acc-head.open .chev{transform:rotate(180deg);}
  .acc-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .acc-body-inner{
    padding:0 14px 14px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.9;
  }

  /* ---------- States ---------- */
  .state-msg{
    margin:30px 16px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    line-height:2;
    padding:30px 16px;
    background:var(--surface);
    border-radius:16px;
    border:1px dashed var(--line);
  }
  .state-msg .big-ic{font-size:28px;display:block;margin-bottom:8px;}

  .skeleton{
    background:linear-gradient(90deg,#241d13 25%,#2c2317 37%,#241d13 63%);
    background-size:400% 100%;
    animation:sk 1.4s ease infinite;
    border-radius:12px;
  }
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:sticky;
    bottom:0;
    background:#1a140d;
    border-top:1px solid var(--line);
    border-radius:0 0 26px 26px;
    display:flex;
    z-index:30;
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:7px 1px;
    cursor:pointer;
    color:var(--muted);
    font-family:inherit;
    font-size:9.8px;
    font-weight:600;
    border-radius:10px;
  }
  .nav-btn .nic{font-size:17px;}
  .nav-btn.active{color:var(--gold);background:rgba(215,171,95,.08);}

  a{color:inherit;}
  ::selection{background:var(--gold);color:#241505;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view">
    <noscript>
      <div style="padding:40px 20px;text-align:center;color:#f4efe4;font-family:Tahoma,sans-serif;">
        این صفحه برای نمایش نیاز به اجرای جاوااسکریپت دارد.<br>
        لطفاً فایل را در یک مرورگر کامل (Chrome یا Safari) باز کنید،
        نه در پیش‌نمایش سریع فایل یا مرورگر داخلی یک اپلیکیشن دیگر.
      </div>
    </noscript>
  </main>
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn" data-route="#/"><span class="nic">🏠</span>خانه</button>
    <button class="nav-btn" data-route="#/prices"><span class="nic">💰</span>قیمت‌ها</button>
    <button class="nav-btn" data-route="#/calculator"><span class="nic">🧮</span>محاسبه</button>
    <button class="nav-btn" data-route="#/products"><span class="nic">💍</span>محصولات</button>
    <button class="nav-btn" data-route="#/consult"><span class="nic">📖</span>مشاوره</button>
  </nav>
</div>
<script>
/* =========================================================
   نرخ طلا — اپلیکیشن نمایش قیمت طلا و محاسبه‌گر
   ساختار: تک صفحه (SPA) با مسیریابی مبتنی بر hash
   ========================================================= */

(function () {
  "use strict";

  var DATA = null;              // { meta, prices, products, consultArticles }
  var DATA_ERROR = false;       // خطای بارگذاری اولیه (بدون هیچ داده معتبری)
  var LAST_CHECK = null;        // زمان آخرین تلاش کاربر برای بررسی/بروزرسانی (سمت کلاینت)
  var LAST_CHECK_FAILED = false;
  var REFRESHING = false;

  var viewEl = document.getElementById("view");
  var topbarEl = document.getElementById("topbar");
  var bottomNavEl = document.getElementById("bottomNav");

  /* =========================================================
     نسخه پشتیبان داده (Fallback)
     =========================================================
     وقتی این فایل مستقیماً با دوبار کلیک (پروتکل file://) باز
     می‌شود، مرورگرها به دلایل امنیتی اجازه fetch کردن data.json
     را نمی‌دهند و برنامه با صفحه سفید یا خطا مواجه می‌شود.

     برای این‌که دموی این پروژه بدون نیاز به هیچ سروری هم کار
     کند، یک نسخه یکسان از همان داده‌های data.json در همین‌جا
     نگه‌داری می‌شود. برنامه ابتدا سعی می‌کند data.json را واکشی
     کند (روش استاندارد و توصیه‌شده وقتی از یک سرور اجرا می‌شود)
     و فقط اگر این واکشی ممکن نبود، از همین نسخه پشتیبان استفاده
     می‌کند. یعنی اگر data.json را ویرایش کنید و پروژه را با یک
     سرور محلی اجرا کنید، همان مقادیر ویرایش‌شده نمایش داده
     می‌شوند.
     ========================================================= */
  var FALLBACK_DATA = {
    "meta": {
      "isMock": true,
      "sourceLabel": "داده نمونه (Mock) — آماده اتصال به API واقعی",
      "lastUpdated": "1404/05/19 - 09:30",
      "currency": "تومان"
    },
    "prices": [
      { "id": "gold18", "title": "طلای ۱۸ عیار", "stamp": "750", "unit": "گرم", "price": 6850000, "previousPrice": 6800000, "change": 50000, "changePercent": 0.74, "gramBased": true, "karat": 18 },
      { "id": "gold24", "title": "طلای ۲۴ عیار", "stamp": "999", "unit": "گرم", "price": 9133000, "previousPrice": 9067000, "change": 66000, "changePercent": 0.73, "gramBased": true, "karat": 24 },
      { "id": "mesghal", "title": "مثقال طلا", "stamp": "18K", "unit": "مثقال (۴.۳۳۱۸ گرم)", "price": 29673000, "previousPrice": 29950000, "change": -277000, "changePercent": -0.92, "gramBased": false },
      { "id": "ounce", "title": "اونس جهانی طلا", "stamp": "999", "unit": "اونس (۳۱.۱ گرم)", "price": 284068000, "previousPrice": 281500000, "change": 2568000, "changePercent": 0.91, "gramBased": false }
    ],

  /* =========================================================
     لایه داده — نقطه اتصال به منبع قیمت طلا
     =========================================================
     getGoldPrices() تنها تابعی است که مسئول دریافت قیمت طلاست.
     در نسخه فعلی، چون به API واقعی و رایگان و بدون کلید که از
     مرورگر قابل فراخوانی باشد دسترسی نداریم، این تابع تلاش
     می‌کند از فایل نمونه data.json بخواند و اگر ممکن نبود (مثلاً
     به دلیل باز بودن پروژه با file:// به‌جای یک سرور)، از نسخه
     پشتیبان داخلی همین فایل استفاده می‌کند. در هر دو حالت، این
     موضوع در رابط کاربری به‌صورت شفاف (برچسب «داده نمونه») به
     کاربر اعلام می‌شود.

     برای اتصال به API واقعی در آینده:
       ۱. این تابع را بازنویسی کنید تا به یک بک‌اند اختصاصی شما
          (مثلاً GET /api/gold-prices) درخواست بزند، نه مستقیم به
          سرویس‌دهنده API. کلید API هرگز نباید در کد فرانت‌اند
          (این فایل) قرار بگیرد.
       ۲. بک‌اند شما کلید API را به‌صورت امن (متغیر محیطی روی
          سرور) نگه می‌دارد و در پاسخ به مرورگر، فقط داده نهایی
          (بدون کلید) را برمی‌گرداند.
       ۳. خروجی تابع باید همان ساختار { meta, prices } را حفظ
          کند تا بقیه برنامه بدون هیچ تغییری کار کند.
     ========================================================= */
  function fetchDataFile() {
    if (!window.fetch || location.protocol === "file:") {
      // fetch روی file:// در اغلب مرورگرها مسدود می‌شود؛
      // مستقیماً به نسخه پشتیبان می‌رویم.
      return Promise.reject(new Error("file-protocol"));
    }
    return fetch("data.json", { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("fetch-failed");
      return res.json();
    });
  }

  function getGoldPrices() {
    return fetchDataFile()
      .catch(function () { return FALLBACK_DATA; })
      .then(function (json) {
        if (!json || !Array.isArray(json.prices) || !json.meta) {
          throw new Error("bad-shape");
        }
        return { meta: json.meta, prices: json.prices };
      });
  }

  // محصولات و مطالب مشاوره در این نسخه از همان منبع خوانده می‌شوند
  function getProductsAndArticles() {
    return fetchDataFile()
      .catch(function () { return FALLBACK_DATA; })
      .then(function (json) {
        if (!json || !Array.isArray(json.products)) throw new Error("bad-shape");
        return { products: json.products, consultArticles: json.consultArticles || [] };
      });
  }

  /* ---------------- Utilities ---------------- */

  function esc(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatToman(n) {
    try {
      return new Intl.NumberFormat("fa-IR").format(Math.round(n));
    } catch (e) {
      return String(Math.round(n));
    }
  }

  function nowLabel() {
    var d = LAST_CHECK || new Date();
    try {
      return d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      return d.toISOString();
    }
  }

  function findPrice(id) {
    if (!DATA) return null;
    for (var i = 0; i < DATA.prices.length; i++) {
      if (DATA.prices[i].id === id) return DATA.prices[i];
    }
    return null;
  }

  function findProduct(id) {
    if (!DATA || !DATA.products) return null;
    for (var i = 0; i < DATA.products.length; i++) {
      if (DATA.products[i].id === id) return DATA.products[i];
    }
    return null;
  }

  function changeChipHTML(item) {
    var isUp = item.change >= 0;
    var arrow = isUp ? "▲" : "▼";
    var sign = isUp ? "+" : "";
    return (
      '<span class="change-chip ' + (isUp ? "up" : "down") + '">' +
        arrow + " " + esc(sign + formatToman(item.change)) + " تومان" +
        " &nbsp;|&nbsp; " + esc(sign + item.changePercent.toFixed(2)) + "٪" +
      "</span>"
    );
  }

  /* ---------------- Router ---------------- */

  function navigate(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", function () {
    try {
      init();
    } catch (e) {
      showFatalError(e);
    }
  });

  // در صورت بروز هر خطای اجراییِ گرفته‌نشده، به‌جای صفحه خالی،
  // یک پیام قابل‌فهم به کاربر نشان می‌دهیم (کمک به عیب‌یابی).
  window.addEventListener("error", function (e) {
    if (!viewEl || !viewEl.innerHTML.trim()) showFatalError(e.error || e.message);
  });

  function showFatalError(err) {
    var msg = (err && err.message) ? err.message : String(err);
    if (viewEl) {
      viewEl.innerHTML =
        '<div style="margin:40px 16px;padding:24px;text-align:center;background:#1f1911;' +
        'border:1px solid #3a2f1e;border-radius:16px;color:#f4efe4;font-size:13px;line-height:2;">' +
        '⚠️ برنامه با خطا مواجه شد و اجرا نشد.<br>' +
        'لطفاً این فایل را در یک مرورگر کامل (Chrome یا Safari) باز کنید، نه در پیش‌نمایش سریع.' +
        '<br><br><span style="font-size:10.5px;color:#a89a80;direction:ltr;display:inline-block;">' + esc(msg) + "</span>" +
        "</div>";
    }
  }

  function init() {
    bottomNavEl.addEventListener("click", function (e) {
      var btn = e.target.closest(".nav-btn");
      if (!btn) return;
      navigate(btn.getAttribute("data-route"));
    });
    loadAll();
  }

  function loadAll() {
    viewEl.innerHTML = loadingSkeleton();
    Promise.all([getGoldPrices(), getProductsAndArticles()])
      .then(function (results) {
        DATA = {
          meta: results[0].meta,
          prices: results[0].prices,
          products: results[1].products,
          consultArticles: results[1].consultArticles
        };
        DATA_ERROR = false;
        LAST_CHECK = new Date();
        LAST_CHECK_FAILED = false;
        render();
      })
      .catch(function () {
        DATA_ERROR = true;
        render();
      });
  }

  function refreshPrices() {
    if (REFRESHING) return;
    REFRESHING = true;
    updateRefreshButtonState();
    getGoldPrices()
      .then(function (res) {
        DATA.meta = res.meta;
        DATA.prices = res.prices;
        LAST_CHECK = new Date();
        LAST_CHECK_FAILED = false;
      })
      .catch(function () {
        LAST_CHECK = new Date();
        LAST_CHECK_FAILED = true;
      })
      .then(function () {
        REFRESHING = false;
        render();
      });
  }

  function updateRefreshButtonState() {
    var btn = document.getElementById("refreshBtn");
    if (!btn) return;
    btn.disabled = REFRESHING;
    btn.classList.toggle("loading", REFRESHING);
  }

  function loadingSkeleton() {
    return (
      '<div style="padding:16px;">' +
        '<div class="skeleton" style="height:150px;border-radius:22px;margin-bottom:12px;"></div>' +
        '<div class="skeleton" style="height:60px;border-radius:14px;margin-bottom:10px;"></div>' +
        '<div class="skeleton" style="height:60px;border-radius:14px;"></div>' +
      "</div>"
    );
  }

  function render() {
    var hash = location.hash || "#/";
    setActiveNav(hash);

    if (DATA_ERROR) {
      renderTopbar("نرخ طلا", false);
      viewEl.innerHTML = fullErrorState();
      attachRetryHandler();
      return;
    }
    if (!DATA) return;

    var m;
    if (hash === "#/" || hash === "") {
      renderHome();
    } else if (hash === "#/prices") {
      renderPrices();
    } else if (hash === "#/calculator") {
      renderCalculator();
    } else if (hash === "#/products") {
      renderProducts();
    } else if ((m = hash.match(/^#\/product\/([^/]+)$/))) {
      renderProductDetail(decodeURIComponent(m[1]));
    } else if (hash === "#/consult") {
      renderConsult();
    } else {
      renderNotFound();
    }

    window.scrollTo(0, 0);
  }

  function setActiveNav(hash) {
    var current = hash.split("?")[0];
    bottomNavEl.querySelectorAll(".nav-btn").forEach(function (b) {
      var r = b.getAttribute("data-route");
      var isActive =
        (r === "#/" && (current === "#/" || current === "")) ||
        (r === "#/prices" && current === "#/prices") ||
        (r === "#/calculator" && current === "#/calculator") ||
        (r === "#/products" && (current === "#/products" || current.indexOf("#/product/") === 0)) ||
        (r === "#/consult" && current === "#/consult");
      b.classList.toggle("active", isActive);
    });
  }

  /* ---------------- Topbar ---------------- */

  function renderTopbar(title, showBack, backHash) {
    if (!showBack) {
      topbarEl.innerHTML =
        '<div class="brand-mark"><span class="dot"></span>' + esc(title) + "</div>" +
        '<span class="mock-pill">داده نمونه</span>';
    } else {
      topbarEl.innerHTML =
        '<button class="back-btn" id="backBtn" aria-label="بازگشت">→</button>' +
        "<h1>" + esc(title) + "</h1>";
      document.getElementById("backBtn").addEventListener("click", function () {
        if (backHash) navigate(backHash);
        else history.back();
      });
    }
  }

  /* ---------------- Error / not found states ---------------- */

  function fullErrorState() {
    return (
      '<div class="state-msg"><span class="big-ic">⚠️</span>' +
      "در حال حاضر دریافت قیمت امکان‌پذیر نیست. لطفاً دوباره تلاش کنید." +
      '<br><button class="btn btn-primary" style="margin-top:14px;display:inline-flex;max-width:170px;" id="retryBtn">تلاش دوباره</button>' +
      "</div>"
    );
  }

  function attachRetryHandler() {
    var btn = document.getElementById("retryBtn");
    if (btn) btn.addEventListener("click", loadAll);
  }

  function renderNotFound() {
    renderTopbar("یافت نشد", true, "#/");
    viewEl.innerHTML = '<div class="state-msg"><span class="big-ic">🔍</span>صفحه موردنظر پیدا نشد.</div>';
  }

  /* ---------------- Home ---------------- */

  function renderHome() {
    renderTopbar("نرخ طلا", false);
    var g18 = findPrice("gold18");
    var others = DATA.prices.filter(function (p) { return p.id !== "gold18"; });

    var html = "";

    if (g18) {
      html +=
        '<div class="price-hero">' +
          '<div class="price-hero-top">' +
            '<div><div class="price-hero-title">' + esc(g18.title) + " (هر " + esc(g18.unit) + ")</div>" +
            '<div class="price-hero-amount">' + esc(formatToman(g18.price)) + ' <span class="u">تومان</span></div>' +
            changeChipHTML(g18) + "</div>" +
            '<div class="stamp lg"><span>' + esc(g18.stamp) + "</span></div>" +
          "</div>" +
          '<div class="price-hero-meta">' +
            '<div class="times">آخرین به‌روزرسانی قیمت: ' + esc(DATA.meta.lastUpdated) + "<br>" +
            "آخرین بررسی شما: " + esc(nowLabel()) + "</div>" +
            '<button class="refresh-btn" id="refreshBtn"><span class="spin">⟳</span>بروزرسانی</button>' +
          "</div>" +
        "</div>";
    }

    html += '<div class="mock-banner">⚠️ ' + esc(DATA.meta.sourceLabel) + ' — این عدد قیمت واقعی و لحظه‌ای بازار نیست.</div>';

    if (LAST_CHECK_FAILED) {
      html += '<div class="error-banner">بروزرسانی اخیر ناموفق بود؛ آخرین قیمت معتبر (زمان: ' + esc(DATA.meta.lastUpdated) + ") نمایش داده شده است.</div>";
    }

    html +=
      '<div class="quick-actions">' +
        '<div class="qa-btn" data-route="#/calculator"><span class="ic">🧮</span>محاسبه</div>' +
        '<div class="qa-btn" data-route="#/prices"><span class="ic">💰</span>قیمت‌ها</div>' +
        '<div class="qa-btn" data-route="#/products"><span class="ic">💍</span>محصولات</div>' +
        '<div class="qa-btn" data-route="#/consult"><span class="ic">📖</span>مشاوره</div>' +
      "</div>" +

      '<div class="section-head"><h3>سایر قیمت‌ها</h3><a id="seeAllLink">مشاهده همه ←</a></div>' +
      '<div class="mini-strip" id="miniStrip">' +
        others.map(function (p) {
          var isUp = p.change >= 0;
          return (
            '<div class="mini-card" data-route="#/prices">' +
              '<div class="mc-title">' + esc(p.title) + "</div>" +
              '<div class="mc-amount">' + esc(formatToman(p.price)) + "</div>" +
              '<div class="mc-change" style="color:' + (isUp ? "var(--up)" : "var(--down)") + '">' +
                (isUp ? "▲" : "▼") + " " + esc(Math.abs(p.changePercent).toFixed(2)) + "٪" +
              "</div>" +
            "</div>"
          );
        }).join("") +
      "</div>";

    viewEl.innerHTML = html;

    var refreshBtn = document.getElementById("refreshBtn");
    if (refreshBtn) refreshBtn.addEventListener("click", refreshPrices);
    updateRefreshButtonState();

    document.getElementById("seeAllLink").addEventListener("click", function () { navigate("#/prices"); });
    viewEl.querySelectorAll("[data-route]").forEach(function (el) {
      el.addEventListener("click", function () { navigate(el.getAttribute("data-route")); });
    });
  }

  /* ---------------- Prices page ---------------- */

  function renderPrices() {
    renderTopbar("قیمت‌های طلا", true, "#/");

    var html =
      '<div class="mock-banner">⚠️ ' + esc(DATA.meta.sourceLabel) + "<br>آخرین به‌روزرسانی: " + esc(DATA.meta.lastUpdated) + "</div>";

    if (LAST_CHECK_FAILED) {
      html += '<div class="error-banner">بروزرسانی اخیر ناموفق بود؛ آخرین قیمت معتبر نمایش داده شده است.</div>';
    }

    html += '<div class="price-list">' + DATA.prices.map(function (p) {
      return (
        '<div class="price-card">' +
          '<div class="stamp"><span>' + esc(p.stamp) + "</span></div>" +
          '<div class="pc-info">' +
            '<div class="pc-title">' + esc(p.title) + "</div>" +
            '<div class="pc-unit">قیمت هر ' + esc(p.unit) + "</div>" +
            '<div class="pc-amount">' + esc(formatToman(p.price)) + ' <span class="u">تومان</span></div>' +
          "</div>" +
          changeChipHTML(p) +
        "</div>"
      );
    }).join("") + "</div>" +
    '<div class="action-row"><button class="btn btn-primary" id="goCalc">🧮 محاسبه قیمت طلای خودم</button></div>';

    viewEl.innerHTML = html;
    document.getElementById("goCalc").addEventListener("click", function () { navigate("#/calculator"); });
  }

  /* ---------------- Calculator ---------------- */

  function renderCalculator() {
    renderTopbar("محاسبه قیمت طلا", true, "#/");

    var gramOptions = DATA.prices.filter(function (p) { return p.gramBased; });

    var html =
      '<div class="calc-card">' +
        '<div class="field">' +
          '<label for="calcWeight">وزن طلا (گرم)</label>' +
          '<input type="number" id="calcWeight" min="0" step="0.01" inputmode="decimal" placeholder="مثلاً ۵.۲">' +
          '<div class="field-error" id="weightError" style="display:none;"></div>' +
        "</div>" +
        '<div class="field">' +
          '<label for="calcKarat">عیار طلا</label>' +
          '<select id="calcKarat">' +
            gramOptions.map(function (p) {
              return '<option value="' + esc(p.id) + '">' + esc(p.title) + "</option>";
            }).join("") +
          "</select>" +
        "</div>" +
        '<div class="calc-result" id="calcResult">' +
          '<div class="cr-label">قیمت تقریبی</div>' +
          '<div class="cr-amount">۰ <span class="u">تومان</span></div>' +
          '<div class="cr-sub">وزن را وارد کنید</div>' +
        "</div>" +
      "</div>";

    viewEl.innerHTML = html;

    var weightInput = document.getElementById("calcWeight");
    var karatSelect = document.getElementById("calcKarat");
    var errorEl = document.getElementById("weightError");
    var resultEl = document.getElementById("calcResult");

    function compute() {
      var weight = parseFloat(weightInput.value);
      var karatPrice = findPrice(karatSelect.value);
      errorEl.style.display = "none";

      if (!weightInput.value.trim()) {
        resultEl.innerHTML =
          '<div class="cr-label">قیمت تقریبی</div><div class="cr-amount">۰ <span class="u">تومان</span></div><div class="cr-sub">وزن را وارد کنید</div>';
        return;
      }
      if (isNaN(weight) || weight <= 0) {
        errorEl.textContent = "لطفاً یک عدد معتبر و بزرگ‌تر از صفر برای وزن وارد کنید.";
        errorEl.style.display = "block";
        resultEl.innerHTML =
          '<div class="cr-label">قیمت تقریبی</div><div class="cr-amount">۰ <span class="u">تومان</span></div><div class="cr-sub">وزن نامعتبر است</div>';
        return;
      }
      if (!karatPrice) return;

      var total = weight * karatPrice.price;
      resultEl.innerHTML =
        '<div class="cr-label">قیمت تقریبی (' + esc(weight) + " گرم، " + esc(karatPrice.title) + ')</div>' +
        '<div class="cr-amount">' + esc(formatToman(total)) + ' <span class="u">تومان</span></div>' +
        '<div class="cr-sub">بر اساس نرخ هر گرم: ' + esc(formatToman(karatPrice.price)) + " تومان — بدون احتساب اجرت ساخت</div>";
    }

    weightInput.addEventListener("input", compute);
    karatSelect.addEventListener("change", compute);
  }

  /* ---------------- Products ---------------- */

  function renderProducts() {
    renderTopbar("محصولات طلا", true, "#/");
    var products = DATA.products || [];

    var html;
    if (!products.length) {
      html = '<div class="state-msg"><span class="big-ic">💍</span>در حال حاضر محصولی ثبت نشده است.</div>';
    } else {
      html = '<div class="prod-grid">' + products.map(function (p) {
        return (
          '<div class="prod-card" data-id="' + esc(p.id) + '">' +
            '<div class="p-ic">' + esc(p.icon || "💍") + "</div>" +
            '<div class="p-name">' + esc(p.name) + "</div>" +
            '<div class="p-meta">' + esc(p.weight) + " گرم · عیار " + esc(p.karat) + "</div>" +
            '<div class="p-price">' + esc(formatToman(p.price)) + " تومان</div>" +
          "</div>"
        );
      }).join("") + "</div>";
    }

    viewEl.innerHTML = html;
    viewEl.querySelectorAll(".prod-card[data-id]").forEach(function (card) {
      card.addEventListener("click", function () {
        navigate("#/product/" + encodeURIComponent(card.getAttribute("data-id")));
      });
    });
  }

  /* ---------------- Product detail ---------------- */

  function renderProductDetail(id) {
    var p = findProduct(id);
    if (!p) {
      renderTopbar("یافت نشد", true, "#/products");
      viewEl.innerHTML = '<div class="state-msg"><span class="big-ic">🔍</span>این محصول پیدا نشد.</div>';
      return;
    }
    renderTopbar(p.name, true, "#/products");

    var phoneDigits = (p.seller && p.seller.phone || "").replace(/\D/g, "");
    var comments = p.comments || [];

    var commentsHTML = comments.length
      ? comments.map(function (c) {
          var stars = "";
          for (var i = 0; i < 5; i++) stars += i < Math.round(c.rating) ? "★" : "☆";
          return (
            '<div class="comment-item">' +
              '<div class="comment-head"><span class="comment-author">' + esc(c.author) + "</span>" +
              '<span class="comment-date">' + esc(c.date) + "</span></div>" +
              '<div class="comment-stars">' + stars + "</div>" +
              '<p class="comment-text">' + esc(c.text) + "</p>" +
            "</div>"
          );
        }).join("")
      : '<p style="font-size:12px;color:var(--muted);">هنوز نظری ثبت نشده است.</p>';

    var html =
      '<div class="detail-hero2">' +
        '<div class="d-ic">' + esc(p.icon || "💍") + "</div>" +
        "<h2>" + esc(p.name) + "</h2>" +
        '<div class="d-meta">وزن ' + esc(p.weight) + " گرم · عیار " + esc(p.karat) + "</div>" +
        '<div class="price-hero-amount" style="justify-content:center;margin-top:10px;">' +
          esc(formatToman(p.price)) + ' <span class="u">تومان</span>' +
        "</div>" +
      "</div>" +

      '<div class="block"><h4>توضیحات</h4><p>' + esc(p.description) + "</p></div>" +

      '<div class="block"><h4>فروشنده و ارتباط</h4>' +
        '<a class="contact-row" href="tel:' + esc(phoneDigits) + '"><span class="ic">📞</span>' +
          '<span><strong>' + esc(p.seller.name) + '</strong><small>تماس تلفنی: ' + esc(p.seller.phone) + "</small></span>" +
        "</a>" +
        '<a class="contact-row" href="sms:' + esc(phoneDigits) + '"><span class="ic">✉️</span>' +
          "<span><strong>ارسال پیامک</strong><small>" + esc(p.seller.phone) + "</small></span>" +
        "</a>" +
        '<div class="contact-row"><span class="ic">📍</span><span><strong>آدرس</strong><small>' + esc(p.seller.address) + "</small></span></div>" +
        '<div class="contact-row"><span class="ic">🕒</span><span><strong>ساعات کاری</strong><small>' + esc(p.seller.workHours) + "</small></span></div>" +
      "</div>" +

      '<div class="block"><h4>نظرات مشتریان</h4>' + commentsHTML + "</div>";

    viewEl.innerHTML = html;
  }

  /* ---------------- Consultation ---------------- */

  function renderConsult() {
    renderTopbar("مشاوره طلا", true, "#/");
    var articles = DATA.consultArticles || [];

    var html = articles.map(function (a, idx) {
      return (
        '<div class="accordion" style="margin-top:' + (idx === 0 ? "16px" : "0") + ';">' +
          '<div class="acc-head" data-idx="' + idx + '"><span>' + esc(a.title) + '</span><span class="chev">⌄</span></div>' +
          '<div class="acc-body" id="accBody' + idx + '"><div class="acc-body-inner">' + esc(a.body) + "</div></div>" +
        "</div>"
      );
    }).join("");

    if (!articles.length) {
      html = '<div class="state-msg"><span class="big-ic">📖</span>مطلبی برای نمایش وجود ندارد.</div>';
    }

    viewEl.innerHTML = html;

    viewEl.querySelectorAll(".acc-head").forEach(function (head) {
      head.addEventListener("click", function () {
        var idx = head.getAttribute("data-idx");
        var body = document.getElementById("accBody" + idx);
        var isOpen = head.classList.contains("open");
        if (isOpen) {
          head.classList.remove("open");
          body.style.maxHeight = "0px";
        } else {
          head.classList.add("open");
          body.style.maxHeight = body.scrollHeight + "px";
        }
      });
    });
  }
})();

</script>
</body>
</html>
